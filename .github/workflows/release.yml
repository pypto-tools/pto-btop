name: Monitor build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:54b271d9562a3686298880df05367909e949ed317e7b1b79b59c696d75f78676
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # GCC 14 on AlmaLinux 8, glibc 2.28; digests resolved from PyPA's Quay registry.
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          dnf -y --disablerepo='epel*' install perl-core
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
          bash scripts/build-release-deps.sh /tmp/pto-btop-deps
      - name: Configure
        run: >-
          cmake -S . -B build/cluster
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_PREFIX_PATH=/tmp/pto-btop-deps -DOPENSSL_ROOT_DIR=/tmp/pto-btop-deps
          -DBTOP_CLUSTER=ON -DBTOP_GPU=OFF -DBTOP_LTO=OFF
          -DBTOP_CLUSTER_STATIC_CXX_RUNTIME=ON -DBUILD_TESTING=ON
          -DBTOP_CLUSTER_STATIC_OPENSSL=ON -DBTOP_CLUSTER_PACKAGE_MAX_GLIBC=2.28
          -DPython3_EXECUTABLE=/opt/python/cp312-cp312/bin/python3
      - name: Build
        run: cmake --build build/cluster --parallel 2
      - name: Test collection, HTTPS, terminals and installation
        run: ctest --test-dir build/cluster --parallel 2 --output-on-failure
      - name: Package
        run: python3 scripts/package.py --build-dir build/cluster --output-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pto-btop-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pto-btop-linux-*
          merge-multiple: true
          path: dist
      - name: Verify tag and assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -f "docs/cluster/releases/$RELEASE_TAG.md"
          cd dist
          test -f "pto-btop-${RELEASE_TAG#v}-linux-amd64.tar.gz"
          test -f "pto-btop-${RELEASE_TAG#v}-linux-arm64.tar.gz"
          sha256sum --check ./*.sha256
      - name: Generate installer with both package checksums
        run: python3 scripts/package-bootstrap.py --assets dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_options=(--draft)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag "${release_options[@]}" \
            --title "pto-btop $RELEASE_TAG" \
            --notes-file "docs/cluster/releases/$RELEASE_TAG.md" dist/*
