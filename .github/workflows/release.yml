name: Monitor build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    # GCC 14 on Debian 12: C++23 and glibc 2.36. The old mutable tag was retired.
    # Digest source is recorded in docs/cluster/release.md.
    container:
      image: gcc@sha256:bf543463a2a7171654faed7d899d74a286fd3706ffb424f52a2cb4dc3f696039
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build nlohmann-json3-dev libssl-dev libgtest-dev python3 openssl binutils
      - name: Configure
        run: >-
          cmake -S . -B build/cluster -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=/usr/local/bin/g++
          -DBTOP_CLUSTER=ON -DBTOP_GPU=OFF -DBTOP_LTO=OFF
          -DBTOP_CLUSTER_STATIC_CXX_RUNTIME=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/cluster --parallel 2
      - name: Test collection, HTTPS, terminals and installation
        run: ctest --test-dir build/cluster --parallel 2 --output-on-failure
      - name: Package
        run: python3 scripts/package.py --build-dir build/cluster --output-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pto-btop-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pto-btop-linux-*
          merge-multiple: true
          path: dist
      - name: Verify tag and assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -f "docs/cluster/releases/$RELEASE_TAG.md"
          cd dist
          test -f "pto-btop-${RELEASE_TAG#v}-linux-amd64.tar.gz"
          test -f "pto-btop-${RELEASE_TAG#v}-linux-arm64.tar.gz"
          sha256sum --check ./*.sha256
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease
          --title "pto-btop $RELEASE_TAG"
          --notes-file "docs/cluster/releases/$RELEASE_TAG.md" dist/*
